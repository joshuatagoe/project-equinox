<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Equinox</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --ink: #1c1915;
      --muted: #5c564c;
      --card: #fffdf8;
      --line: #e4ddd0;
      --accent: #0f6e56;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --ink: #f4f1ea;
        --muted: #c3baad;
        --card: #1e1c19;
        --line: #34302a;
        --accent: #7dcea0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    p.kicker {
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.75rem;
      color: var(--accent);
      margin: 0 0 0.75rem;
    }
    h1 { font-weight: 500; font-size: 2.5rem; margin: 0 0 0.75rem; }
    .lede { font-size: 1.15rem; line-height: 1.5; margin: 0 0 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.95rem;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 0.2rem;
      border-bottom: 1px solid var(--line);
    }
    th { color: var(--muted); font-weight: 600; }
    tr:last-child th, tr:last-child td { border-bottom: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Project Equinox</p>
    <h1>One codebase, two hosts.</h1>
    <p class="lede">
      This checkout is ready for a GitHub repository and a GitLab repository,
      with the same <code>make gate</code> check on both.
    </p>
    <div class="card">
      <table>
        <tr><th>Status</th><td id="status">checking…</td></tr>
        <tr><th>Version</th><td id="version">—</td></tr>
        <tr><th>Hosts</th><td id="hosts">github, gitlab</td></tr>
        <tr><th>Health</th><td><a href="/health">/health</a></td></tr>
      </table>
    </div>
  </main>
  <script>
    fetch("/health").then((r) => r.json()).then((data) => {
      document.getElementById("status").textContent = data.status;
      document.getElementById("version").textContent = data.version;
      document.getElementById("hosts").textContent = data.hosts.join(", ");
    }).catch(() => {
      document.getElementById("status").textContent = "unreachable";
    });
  </script>
</body>
</html>
