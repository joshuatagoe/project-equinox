# The same gate as GitHub Actions, which is the CI of record (D40). labs.gauntletai.com gives
# this project no shared runners, so the job runs only once a project runner is registered and
# the CI/CD variable EQUINOX_GITLAB_RUNNER is set. Without it, no pipeline is created at all,
# instead of one that waits forever.
gate:
  image: python:3.12
  cache:
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  script:
    - python -m venv .venv
    - .venv/bin/pip install -q -r requirements.txt
    - make gate
  rules:
    - if: $EQUINOX_GITLAB_RUNNER && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $EQUINOX_GITLAB_RUNNER && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
